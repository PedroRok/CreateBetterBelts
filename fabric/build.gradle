plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Release do Create Fabric para 1.20.1. O Loom descarta os jars aninhados, entao as libs que ele bundla
    // (Registrate, Ponder, Flywheel, Porting Lib, configs...) sao declaradas uma a uma.
    modImplementation("maven.modrinth:create-fabric:${create_fabric_version}") { transitive = false }

    modImplementation("com.tterrag.registrate_fabric:Registrate:${registrate_fabric_version}") { transitive = false }
    modImplementation("net.createmod.ponder:Ponder-Fabric-${minecraft_version}:${ponder_fabric_version}") { transitive = false } // Catnip is inside
    modImplementation("dev.engine-room.flywheel:flywheel-fabric-${minecraft_version}:${flywheel_fabric_version}") { transitive = false }
    porting_lib_modules.split(',').each { module ->
        modImplementation("io.github.fabricators_of_create.Porting-Lib:${module}:${porting_lib_version}") { transitive = false }
    }

    compileOnly("com.google.code.findbugs:jsr305:3.0.2")

    modLocalRuntime("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}") { transitive = false }
    localRuntime("com.electronwill.night-config:core:${night_config_version}")
    localRuntime("com.electronwill.night-config:toml:${night_config_version}")
    modLocalRuntime("com.jamieswhiteshirt:reach-entity-attributes:${reach_entity_attributes_version}") { transitive = false }
    modLocalRuntime("io.github.tropheusj:milk-lib:${milk_lib_version}") { transitive = false }
    modLocalRuntime("io.github.tropheusj:dripstone-fluid-lib:${dripstone_fluid_lib_version}") { transitive = false }
}

loom {
    def aw = project.rootProject.file("common/src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/1.20.1/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/1.20.1/server')
        }
        datagen {
            client()
            setConfigName('Fabric Data')
            ideConfigGenerated(true)
            runDir('runs/1.20.1/datagen')
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${project.rootProject.file('common/src/generated/resources').absolutePath}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            vmArg "-Dporting_lib.datagen.existing_resources=${project.rootProject.file('common/src/main/resources').absolutePath}"
        }
    }
}
