plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    // Compila contra o Forge porque o jar do Create expoe tipos do Forge nas assinaturas (NonNullPredicate,
    // BakedModelWrapper...). Nada do Forge pode ser usado aqui: o modulo fabric compila esses mesmos fontes.
    version = "${minecraft_version}-${forge_version}"
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // o Create bundla o MixinExtras no Forge e o Fabric Loader ja traz o dele, entao e seguro usar no common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: mixinextras_version
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: mixinextras_version

    // jar do Forge, remapeado de SRG para os nomes oficiais
    modCompileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    modCompileOnly("com.tterrag.registrate:Registrate:${registrate_version}") { transitive = false }
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}") { transitive = false }
    modCompileOnly("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}") { transitive = false }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    sourceSets.main.resources.sourceDirectories.each { dir -> commonResources dir }
}
